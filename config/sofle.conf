# =============================================================================
# KEYBOARD IDENTITY
# =============================================================================

# Display name shown to the host when pairing over Bluetooth
CONFIG_ZMK_KEYBOARD_NAME="Sofle"


# =============================================================================
# BLUETOOTH
# =============================================================================

# Increase BLE transmit power to +8dBm — helps with range, latency,
# and left/right half communication reliability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix a Windows-specific bug where battery level reports cause BLE errors
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# How often the battery level is reported to the host (in seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# -- Useful extras (commented out) --
# Limit max number of paired Bluetooth profiles (default is 5)
#CONFIG_BT_MAX_PAIRED=5
# Enable BLE passkey authentication for pairing
#CONFIG_BT_FIXED_PASSKEY=n


# =============================================================================
# KEY SCANNING / DEBOUNCE
# =============================================================================

# Debounce delay in milliseconds for key press and release
# Lower = more responsive but may cause ghost inputs on cheap switches
# Higher = more stable but slightly less responsive (default ZMK is 5ms)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# -- Useful extras (commented out) --
# Debounce mode — use "per-key" for more precise debouncing per switch
#CONFIG_ZMK_KSCAN_DEBOUNCE_MODE_PER_KEY=y


# =============================================================================
# POWER MANAGEMENT / SLEEP
# =============================================================================

# Milliseconds of inactivity before entering idle state (600000ms = 10 minutes)
# In idle, RGB turns off but the keyboard remains responsive
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Deep sleep — disabled here since this is a wired build
# Enable this if running on battery to save power
CONFIG_ZMK_SLEEP=n

# Milliseconds of inactivity before entering deep sleep (900000ms = 15 minutes)
# Only relevant if CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0

# -- Useful extras (commented out) --
# Turn off external power (e.g. LED power rail) when entering idle
#CONFIG_ZMK_EXT_POWER_AUTO_OFF=y


# =============================================================================
# DISPLAY / OLED
# =============================================================================

# Enable the OLED display
CONFIG_ZMK_DISPLAY=y

# Use the built-in ZMK status screen layout
# Set to n if using custom widgets instead
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# Turn off display after idle timeout to prevent burn-in
#CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Run display updates on a dedicated work queue
# Helps if display updates are causing input latency
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# -- Widgets --
# Show current active layer name
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Show words per minute typing speed
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Show battery percentage
#CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# Show connection output (USB vs BLE) and BLE profile
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Show connected peripheral (left half) status
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# Bongo cat typing animation
#CONFIG_ZMK_WIDGET_BONGO_CAT=y

# Luna dog animation
#CONFIG_ZMK_WIDGET_LUNA=y

# Static label text on display
#CONFIG_ZMK_WIDGET_LABEL=y
#CONFIG_ZMK_WIDGET_LABEL_TEXT="Sofle RGB"

# Flip display orientation 180 degrees
#CONFIG_ZMK_DISPLAY_INVERT=y


# =============================================================================
# ZMK STUDIO (runtime keymap editing over USB)
# =============================================================================

# Enable ZMK Studio — allows editing keymaps live without reflashing
CONFIG_ZMK_STUDIO=y

# Require unlock before keymap changes can be made
CONFIG_ZMK_STUDIO_LOCKING=n

# Automatically lock Studio when USB disconnects
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n


# =============================================================================
# RGB UNDERGLOW
# =============================================================================

# Enable RGB underglow (WS2812/SK6812 LEDs)
CONFIG_ZMK_RGB_UNDERGLOW=y

# Automatically turn off RGB when keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Control the RGB power via the external power rail pin
# Set to y if your LEDs are on the VCC switch pin (P0.13 on nice!nano)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Starting RGB effect index (3 = rainbow, 0 = solid, 1 = breathe, 2 = spectrum)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Maximum brightness cap (0-100) — lower values reduce power draw and heat
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80

# -- Useful extras (commented out) --
# Default hue (0-359 degrees on color wheel)
#CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
# Default saturation (0-100)
#CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# Default brightness on startup (0-100)
#CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
# Keep RGB state in memory across power cycles
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n


# =============================================================================
# ROTARY ENCODER
# =============================================================================

# Enable EC11 rotary encoder driver
CONFIG_EC11=y

# Process encoder events on the global thread (recommended for most builds)
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
